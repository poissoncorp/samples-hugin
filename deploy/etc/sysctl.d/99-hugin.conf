# /etc/sysctl.d/99-hugin.conf — kernel VM tuning for the Hugin Pi appliance.
#
# History:
#   2026-04-26 (Act XVII T-bundle): swappiness=10, vfs_cache_pressure=200.
#     Reasoning at the time: keep Ollama anon pages in RAM at the
#     expense of file caches. vfs_cache_pressure=200 was wrong —
#     observed live 2026-05-04 to cause RavenDB Voron mmap pages to
#     be evicted aggressively, forcing SD re-faults on every query.
#
#   2026-05-04 (Act XXIX, autonomous-loop): vfs_cache_pressure 200→50.
#     Lower value tells kernel to KEEP file-backed pages (Voron mmap)
#     longer. swappiness stays at 10 (low) so anon pages (Ollama
#     model) prefer to stay in RAM. min_free_kbytes bumped to 32 MB
#     to reduce OOM-kill risk on a 416 MB Pi.

# Kernel prefers reclaiming page cache over swapping anon pages.
# Combined with vfs_cache_pressure=50 below, this means: keep both
# anon AND file pages in RAM as long as possible; only swap when
# absolutely necessary.
# DO NOT set to 0 — observed live 2026-05-04 04:39 UTC to cause kernel
# OOM-kill of sshd when memory pressure hit, leaving Pi unrecoverable.
# 1 is the minimum-swap-without-OOM-risk setting; 10 is the sweet
# spot for this hardware (allows zram swap to absorb a transient
# pressure event).
vm.swappiness = 10

# Lower = kernel keeps dentry/inode + file-backed pages longer.
# Was 200 (aggressive eviction). Lowered to 50 because Voron mmap
# pages on RavenDB are file-backed and getting evicted was forcing
# SD re-reads, dominating cold-query wallclock.
vm.vfs_cache_pressure = 50

# Reserve more memory for kernel allocations. Default is ~16 MB on
# 416 MB Pi. Bumping to 32 MB gives the kernel slack so it can do
# zone reclaim BEFORE userspace processes start to OOM.
vm.min_free_kbytes = 32768

# overcommit_memory=2 (strict accounting) is tempting — would make
# apt-get install fail cleanly instead of OOM-killing things. But
# many Linux apps rely on overcommit, including Ollama's mmap and
# RavenDB's working set growth. Leaving at default (0 = heuristic).
# vm.overcommit_memory = 0
