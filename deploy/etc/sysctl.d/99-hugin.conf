# /etc/sysctl.d/99-hugin.conf — kernel VM tuning for the Hugin Pi appliance.
#
# Current values are the Act XXXIII fix (2026-05-07), tuned for the HuginAI
# working set: 22 GB Voron + 6 GB indexes mmaped + ~150 MB Ollama anon +
# ~50 MB hugin anon on a 416 MB RAM Pi Zero 2 W with 768 MB zram (lz4).
#
# History:
#   2026-04-26 (Act XVII T-bundle): swappiness=10, vfs_cache_pressure=200.
#     Tuned for Ollama-anon-priority on the small Hugin-q4 corpus.
#   2026-05-04 (Act XXIX): vfs_cache_pressure 200→50, min_free_kbytes
#     32 MB. Tuned for Voron-mmap-priority on Hugin-q4.
#   2026-05-07 (Act XXXIII): swappiness 10→60, vfs_cache_pressure 50→200,
#     min_free_kbytes 32 MB→8 MB. The earlier values caused a degenerate
#     kernel reclaim loop with the larger HuginAI corpus: file cache
#     evicted to 0%, anon swapped, kswapd at 91% CPU. See THE-ARC.md
#     Act XXXII Coda for the diagnosis.

# 60 (default) — let zram absorb anon pressure freely. Higher than the
# Hugin-q4-era 10 because zram is fast (compressed RAM, not SD), so
# swap-in is cheap. 10 was wrong on HuginAI: kernel kept anon pinned,
# evicted Voron mmap pages instead, forcing SD re-faults on every query.
vm.swappiness = 60

# 200 — evict cold file-backed (Voron mmap) pages aggressively so the
# active working set stays resident. With 22 GB Voron mmap on a 416 MB
# Pi, the kernel must recycle pages constantly; 50 made it cling to cold
# ones, starving the hot working set.
vm.vfs_cache_pressure = 200

# 8 MB — kernel free pool. Was 32 MB (8% of total RAM, excessive on this
# hardware). Lower value gives more usable RAM for the DB working set
# without compromising allocation latency.
vm.min_free_kbytes = 8192

# overcommit_memory=2 (strict accounting) is tempting — would make
# apt-get install fail cleanly instead of OOM-killing things. But many
# Linux apps rely on overcommit, including Ollama's mmap and RavenDB's
# working set growth. Leaving at default (0 = heuristic).
# vm.overcommit_memory = 0
