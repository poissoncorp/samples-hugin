[Unit]
# Stage RavenDB startup AFTER Ollama has loaded its embedding model.
# This breaks the cold-boot OOM cascade pattern: with parallel start,
# Ollama (90 MB) + RavenDB (50-80 MB anon working set) racing for
# memory in the same 5-10 s window pushes the kernel into reclaim
# territory. Sequencing them serially gives each a clean memory
# state to start into.
#
# Boot timeline (post-fix):
#   t=0    : kernel + base daemons up. ~390 MB free.
#   t=5    : ollama.service starts. Idle. ~390 MB free.
#   t=10   : ollama ExecStartPost POSTs /api/embeddings — model loads.
#            ~13 s of CPU + 90 MB anon allocation. ~300 MB free after.
#   t=25   : ollama.service marked active. ravendb.service can start.
#   t=25-60: RavenDB loads voron files into mmap'd region. Anon
#            grows to 50-80 MB. Free RAM eased by file cache eviction
#            but NO competing 90 MB allocation in flight. Stable.
#   t=60+  : hugin.service starts. wakeUp's boot-defer (30 s) waits
#            for RavenDB to settle further before any query.
After=ollama.service
Wants=ollama.service
