[Service]
# RavenDB is the largest anon-memory consumer on this appliance.
# Without a cap, its heap can grow until kernel OOM kicks in and
# kills critical processes (observed 2026-05-04 04:39 UTC).
#
# Note: this only caps RavenDB's anon (heap) RSS. Voron's mmap'd
# files are file-backed and NOT counted against MemoryMax — they're
# managed by the kernel's page cache layer. Observed RavenDB anon
# RSS is typically 50-80 MB on this Pi; 220 MB leaves substantial
# headroom for transient peaks during indexing.
MemoryMax=220M
# Default systemctl-stop timeout is 90 s. RavenDB occasionally needs
# longer to flush; 15 s is enough for normal stop, won't hang the
# session if something goes wrong.
TimeoutStopSec=30s
# RavenDB is essential to the demo — bias OOM scoring AGAINST killing
# it if a system-wide memory crisis happens.
OOMScoreAdjust=-200
