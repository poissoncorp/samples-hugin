[Service]
# Memory cgroup limits — prevents hugin from triggering system-wide OOM
# (which can take out sshd, leaving the Pi unrecoverable, as observed
# 2026-05-04 04:39 UTC during the autonomous-loop perf session).
#
# hugin's working set on this hardware is typically 30-50 MB resident.
# 96 MB MemoryMax leaves headroom; 64 MB MemoryHigh applies pressure
# before the hard limit. Swap is allowed (cgroup inherits kernel
# swappiness) so hugin can be paged under system pressure without
# instant OOM.
#
# When this cgroup hits its limit, OOM kicks in INSIDE the cgroup —
# hugin gets killed, sshd and ravendb survive. systemd restarts hugin
# automatically.
MemoryHigh=64M
MemoryMax=96M
OOMPolicy=continue
# OOMScoreAdjust > 0 = more likely to be killed by system OOM than
# default (0). Hugin is restartable; sshd is not. Bias system-OOM
# scoring against hugin so a true memory crisis doesn't take SSH out.
OOMScoreAdjust=200
