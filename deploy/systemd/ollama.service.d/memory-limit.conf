[Service]
# Memory cgroup limits for Ollama. The Q4 model is 90 MB; Ollama's
# runner process holds it in anon memory. Without a cap, an unexpected
# concurrent embed (e.g. wakeUp racing with a user query during cold
# boot) could push the system into OOM territory.
#
# 160 MB MemoryMax = 90 MB model + 70 MB headroom for tokenizer +
# transient buffers. Observed Ollama RSS in steady state: 90-120 MB.
#
# Cap-induced OOM-kill within this cgroup will trigger systemd to
# restart Ollama. Better than the kernel OOM-killing sshd or
# ravendb in a system-wide pressure event.
MemoryHigh=128M
MemoryMax=160M
OOMPolicy=continue
# Ollama is restartable; the model file stays on disk. Bias OOM
# scoring AGAINST critical infra (ravendb has -200, sshd has the
# default ~0).
OOMScoreAdjust=100
