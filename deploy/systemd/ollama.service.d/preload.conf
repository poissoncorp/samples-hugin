[Service]
# Load the embedding model into Ollama's runner BEFORE other services
# (ravendb, hugin) start. This breaks the cold-boot OOM cascade by
# sequencing the 90 MB Q4 model allocation EARLY when free memory is
# at its peak (~326 MB right after kernel boot, before RavenDB has
# loaded its working set).
#
# History (2026-05-04): wakeUp's `axios.post(/api/embeddings)` was
# causing a cascade because it allocated 90 MB at the same moment
# RavenDB and hugin were both growing. Moving the allocation to
# ollama.service's startup, before ravendb.service starts, gives
# each service a clean memory state to start into.
#
# ExecStartPost runs AFTER Ollama is `active` (ready to receive
# requests). It blocks systemd from marking the unit complete until
# the model is loaded. With After=ollama.service on ravendb +
# Requires/After chain, downstream services wait for this.
#
# Timeout 120 s: cold-load on Pi Zero 2 W is ~13 s for Q4. Generous
# margin for slow SD reads on a fresh boot. If model load fails
# (download issue, model deleted), ollama.service still goes active
# (the curl is best-effort with `|| true`); first user query will
# trigger lazy load as fallback.
ExecStartPost=/bin/sh -c '\
  for i in $(seq 1 30); do \
    if curl -sf -m 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi; \
    sleep 0.5; \
  done; \
  curl -sf -m 120 -X POST http://127.0.0.1:11434/api/embeddings \
    -H "Content-Type: application/json" \
    -d "{\"model\":\"${EMB_MODEL:-nomic-embed-text:q4_k_m}\",\"prompt\":\"boot-warmup\"}" \
    >/dev/null 2>&1 || true; \
  echo "ollama preload complete" \
'
TimeoutStartSec=180s
