[Service]
# After ollama is up, page the embedding model into RAM so RavenDB's
# subsequent mmap pressure doesn't evict it. Hugin's /api/boot-status
# reports `ollama: loading` until /api/ps shows the model resident.
#
# This runs as the ollama service user; curl is required (preinstalled
# on Pi OS Bookworm).
ExecStartPost=/bin/sh -c '\
  for i in $(seq 1 60); do \
    code=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:11434/api/tags || true); \
    [ "$code" = "200" ] && break; sleep 1; \
  done; \
  curl -sS --max-time 30 http://127.0.0.1:11434/api/embeddings \
    -H "Content-Type: application/json" \
    -d "{\"model\":\"snowflake-arctic-embed:s\",\"prompt\":\"warm\"}" \
    >/dev/null || true \
'
